/* ---------- OneDrive-Abgleich (Microsoft Graph, Anmeldung per OAuth 2.0 mit PKCE) ---------- */
const SYNC_KEY = STORE_KEY + '-onedrive';
const MS_AUTH = 'https://login.microsoftonline.com/common/oauth2/v2.0';
const GRAPH = 'https://graph.microsoft.com/v1.0';
const MS_SCOPES = 'offline_access User.Read Files.ReadWrite.AppFolder';
const REMOTE_FILE = '/me/drive/special/approot:/zeiterfassung.json';
let SY = {};
try { SY = JSON.parse(localStorage.getItem(SYNC_KEY) || '{}') || {}; } catch (e) { SY = {}; }
function saveSync() { try { localStorage.setItem(SYNC_KEY, JSON.stringify(SY)); } catch (e) { /* egal */ } }
const clientId = () => ONEDRIVE_CLIENT_ID || SY.clientId || '';
const redirectUri = () => location.origin + location.pathname.replace(/index\.html$/, '');
const connected = () => !!(SY.tok && SY.tok.refresh);

function b64url(bytes) { return btoa(String.fromCharCode(...new Uint8Array(bytes))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
function randomStr(n) { const a = new Uint8Array(n); crypto.getRandomValues(a); return b64url(a).slice(0, n); }

async function msConnect() {
  if (!clientId()) { toast('OneDrive ist noch nicht eingerichtet: Client-ID fehlt (siehe „Mehr → Erweitert“).'); return; }
  if (!window.crypto || !crypto.subtle || location.protocol !== 'https:') { toast('Die Anmeldung funktioniert nur in der installierten App (https).'); return; }
  const verifier = randomStr(64), state = randomStr(20);
  SY.pkce = { verifier, state }; saveSync();
  const challenge = b64url(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier)));
  location.href = `${MS_AUTH}/authorize?` + new URLSearchParams({
    client_id: clientId(), response_type: 'code', redirect_uri: redirectUri(), response_mode: 'query',
    scope: MS_SCOPES, code_challenge: challenge, code_challenge_method: 'S256', state, prompt: 'select_account',
  });
}
async function tokenRequest(params) {
  const res = await fetch(`${MS_AUTH}/token`, { method: 'POST', headers: { 'content-type': 'application/x-www-form-urlencoded' }, body: new URLSearchParams({ client_id: clientId(), scope: MS_SCOPES, ...params }) });
  const j = await res.json().catch(() => ({}));
  if (!res.ok) { const err = new Error(j.error_description || j.error || 'Token-Fehler'); err.auth = true; throw err; }
  return { access: j.access_token, refresh: j.refresh_token || SY.tok?.refresh, exp: Date.now() + ((j.expires_in || 3600) - 120) * 1000 };
}
async function handleAuthRedirect() {
  const p = new URLSearchParams(location.search);
  if (!p.has('code') && !p.has('error')) return false;
  history.replaceState(null, '', location.pathname + location.hash);
  if (p.get('error')) { toast('OneDrive-Anmeldung nicht abgeschlossen: ' + (p.get('error_description') || p.get('error')).slice(0, 120)); return true; }
  if (!SY.pkce || p.get('state') !== SY.pkce.state) { toast('Anmeldung ungültig – bitte erneut verbinden.'); return true; }
  try {
    SY.tok = await tokenRequest({ grant_type: 'authorization_code', code: p.get('code'), redirect_uri: redirectUri(), code_verifier: SY.pkce.verifier });
    SY.pkce = null; SY.needLogin = false; SY.err = '';
    saveSync();
    try { const me = await (await graph('/me')).json(); SY.account = me.userPrincipalName || me.mail || me.displayName || ''; saveSync(); } catch (e) { /* egal */ }
    S.welcomed = true; persist();
    toast('Mit OneDrive verbunden');
    await Sync.now();
  } catch (e) { SY.pkce = null; saveSync(); toast('OneDrive-Anmeldung fehlgeschlagen: ' + e.message.slice(0, 120)); }
  render();
  return true;
}
async function accessToken() {
  if (!connected()) throw Object.assign(new Error('Nicht verbunden'), { auth: true });
  if (Date.now() < SY.tok.exp) return SY.tok.access;
  try { SY.tok = await tokenRequest({ grant_type: 'refresh_token', refresh_token: SY.tok.refresh }); saveSync(); return SY.tok.access; }
  catch (e) { if (e.auth) { SY.needLogin = true; saveSync(); } throw e; }
}
async function graph(path, opts = {}) {
  const t = await accessToken();
  return fetch(GRAPH + path, { ...opts, headers: { ...(opts.headers || {}), authorization: 'Bearer ' + t } });
}

/* Zusammenführen zweier Datenstände: pro Eintrag gewinnt die neuere Änderung, Löschmarken gelten,
   Einstellungen und Timer als Ganzes nach Zeitstempel. */
const byId = (a, b) => (a.id < b.id ? -1 : a.id > b.id ? 1 : 0);
function payload(x) {
  const o = {};
  for (const c of SYNC_COLLS) o[c] = [...(x[c] || [])].sort(byId);
  o.del = x.del || {}; o.planSkip = [...new Set(x.planSkip || [])].sort();
  for (const k of SETTINGS_KEYS) o[k] = x[k];
  o.su = x.su || 0; o.running = x.running || null; o.runU = x.runU || 0;
  return o;
}
function canon(v) {
  if (Array.isArray(v)) return '[' + v.map(canon).join(',') + ']';
  if (v && typeof v === 'object') return '{' + Object.keys(v).filter((k) => v[k] !== undefined).sort().map((k) => JSON.stringify(k) + ':' + canon(v[k])).join(',') + '}';
  return JSON.stringify(v ?? null);
}
function mergeData(L, R) {
  if (!R) return L;
  const out = { ...L };
  const del = { ...(R.del || {}) };
  for (const [id, t] of Object.entries(L.del || {})) del[id] = Math.max(del[id] || 0, t);
  for (const c of SYNC_COLLS) {
    const map = new Map();
    for (const x of R[c] || []) map.set(x.id, x);
    for (const x of L[c] || []) { const r = map.get(x.id); if (!r || (x.u || 0) >= (r.u || 0)) map.set(x.id, x); }
    out[c] = [...map.values()].filter((x) => !(del[x.id] && del[x.id] >= (x.u || 0)));
  }
  for (const p of PRESET_LABELS) if (!out.labels.some((l) => l.id === p.id)) out.labels.push({ ...p, preset: true, hidden: false });
  out.del = del;
  out.planSkip = [...new Set([...(L.planSkip || []), ...(R.planSkip || [])])];
  if ((R.su || 0) > (L.su || 0)) { for (const k of SETTINGS_KEYS) if (R[k] !== undefined) out[k] = R[k]; out.su = R.su; }
  if ((R.runU || 0) > (L.runU || 0)) { out.running = R.running || null; out.runU = R.runU; }
  return out;
}

const Sync = {
  busy: false, again: false, timer: null,
  schedule() {
    if (!connected()) return;
    clearTimeout(this.timer);
    this.timer = setTimeout(() => this.now(), 1500);
  },
  async now() {
    if (!connected() || SY.needLogin) return;
    if (this.busy) { this.again = true; return; }
    if (navigator.onLine === false) { SY.err = 'Offline – Abgleich folgt'; renderSyncPill(); return; }
    this.busy = true; renderSyncPill();
    try {
      for (let attempt = 0; attempt < 3; attempt++) {
        let remote = null, eTag = null;
        const meta = await graph(REMOTE_FILE);
        if (meta.status !== 404) {
          if (!meta.ok) throw new Error('OneDrive antwortet mit ' + meta.status);
          const m = await meta.json();
          eTag = m.eTag;
          const dl = await fetch(m['@microsoft.graph.downloadUrl'], { cache: 'no-store' });
          if (!dl.ok) throw new Error('Download fehlgeschlagen (' + dl.status + ')');
          const j = await dl.json();
          remote = j && j.data ? j.data : j;
        }
        // Zusammenführen direkt mit dem aktuellen Stand (keine await-Lücke)
        const before = canon(payload(S));
        const merged = mergeData(S, remote);
        if (canon(payload(merged)) !== before) {
          const oldState = S.state;
          S = merged;
          if (S.state !== oldState) S.holidays = {};
          takeSnap(); persist(); render();
        }
        if (remote && canon(payload(remote)) === canon(payload(S))) break;   // nichts hochzuladen
        const body = JSON.stringify({ app: 'lehrkraft-zeiterfassung', v: 1, saved: new Date().toISOString(), data: payload(S) });
        const put = await graph(REMOTE_FILE + ':/content', { method: 'PUT', headers: { 'content-type': 'application/json', ...(eTag ? { 'if-match': eTag } : {}) }, body });
        if (put.status === 412 || put.status === 409) continue;     // anderes Gerät war schneller → neu zusammenführen
        if (!put.ok) throw new Error('Hochladen fehlgeschlagen (' + put.status + ')');
        break;
      }
      SY.last = Date.now(); SY.err = '';
    } catch (e) {
      SY.err = e.auth ? 'Anmeldung abgelaufen' : (e.message || 'Abgleich fehlgeschlagen');
    } finally {
      this.busy = false; saveSync(); renderSyncPill();
      if (ui.tab === 'mehr' && $('#sheet').hidden) render();
      if (this.again) { this.again = false; this.schedule(); }
    }
  },
};
function msDisconnect() {
  confirmSheet({
    title: 'OneDrive trennen?', text: 'Die Daten bleiben auf diesem Gerät und in deinem OneDrive erhalten. Es wird nur nicht mehr abgeglichen.', ok: 'Trennen', danger: true,
    onOk: () => { SY = { clientId: SY.clientId }; saveSync(); render(); toast('OneDrive getrennt'); },
  });
}
function syncLabel() {
  if (!connected()) return null;
  if (SY.needLogin) return ['err', 'Anmelden'];
  if (Sync.busy) return ['busy', 'Abgleich …'];
  if (SY.err) return ['err', 'OneDrive ⚠'];
  return ['ok', SY.last ? 'OneDrive ' + hm(new Date(SY.last)) : 'OneDrive'];
}
function renderSyncPill() {
  const el = $('#sync-pill'); if (!el) return;
  const l = syncLabel();
  el.innerHTML = l ? `<button type="button" class="sync ${l[0]}" data-a="tab" data-id="mehr" aria-label="Abgleich: ${esc(l[1])}"><i></i>${esc(l[1])}</button>`
    : `<button type="button" class="sync" data-a="tab" data-id="mehr"><i></i>Nur dieses Gerät</button>`;
}
function storageCard() {
  const cid = clientId();
  let body;
  if (connected()) {
    body = `
      <p>Verbunden mit <b>OneDrive</b>${SY.account ? ` als <b>${esc(SY.account)}</b>` : ''}.</p>
      <p class="muted small">Datei: OneDrive › Apps › (App-Name) › zeiterfassung.json${SY.last ? ` · zuletzt abgeglichen ${fmtDateShort(iso(new Date(SY.last)))} ${hm(new Date(SY.last))}` : ''}</p>
      ${SY.needLogin ? `<div class="banner">Die Anmeldung ist abgelaufen. Bitte kurz neu anmelden – deine Daten bleiben erhalten.<button class="btn primary sm" data-a="msConnect">Erneut anmelden</button></div>`
        : SY.err ? `<div class="banner">${esc(SY.err)}</div>` : ''}
      <div class="grid2"><button class="btn" data-a="syncNow">Jetzt abgleichen</button><button class="btn ghost" data-a="msDisconnect">Trennen</button></div>`;
  } else {
    body = `
      <p class="muted small">Mit OneDrive werden deine Zeiten automatisch zwischen Handy, Tablet und Computer abgeglichen. Anmeldung mit deinem Microsoft-Konto (privat oder Schule).</p>
      <button class="btn primary block" data-a="msConnect" ${cid ? '' : 'disabled'}>Mit OneDrive verbinden</button>
      ${cid ? '' : '<p class="muted small">Zum Verbinden fehlt noch die Client-ID der App-Registrierung (siehe „Erweitert“).</p>'}
      <p class="muted small">iCloud lässt sich in Web-Apps nicht direkt anbinden. Du kannst aber unten jederzeit eine Sicherung in iCloud Drive ablegen.</p>`;
  }
  return `<section class="card">
    <h2>Speicherort & Abgleich</h2>
    ${body}
    <details><summary class="small" style="cursor:pointer;font-weight:700">Erweitert: App-Registrierung</summary>
      <div class="stack" style="margin-top:10px">
        <label class="f" for="set-client">Client-ID (Anwendungs-ID)
          <input type="text" id="set-client" data-c="clientId" value="${esc(SY.clientId || '')}" placeholder="${ONEDRIVE_CLIENT_ID ? 'fest eingebaut' : '00000000-0000-0000-0000-000000000000'}" autocomplete="off" spellcheck="false" ${ONEDRIVE_CLIENT_ID ? 'disabled' : ''}></label>
        <p class="muted small">Umleitungs-URI für die Registrierung (Plattform „Single-Page-Anwendung“):<br><code style="word-break:break-all">${esc(redirectUri())}</code></p>
      </div></details>
  </section>`;
}
function welcomeSheet() {
  const cid = clientId();
  openSheet(`
    <p class="eyebrow">Willkommen</p>
    <h2 id="sheet-title">Wo sollen deine Zeiten gespeichert werden?</h2>
    <button class="btn primary block big" data-s="od" ${cid ? '' : 'disabled'}>Mit OneDrive verbinden</button>
    <p class="muted small">Automatischer Abgleich zwischen all deinen Geräten. ${cid ? '' : '<b>Noch nicht eingerichtet</b> – die App-Registrierung fehlt noch; du kannst OneDrive später unter „Mehr“ verbinden.'}</p>
    <button class="btn block" data-s="local">Nur auf diesem Gerät</button>
    <p class="muted small">Die Daten bleiben in diesem Browser. Sicherungen kannst du jederzeit als Datei ablegen, z. B. in iCloud Drive.</p>`, (b) => {
    b.onclick = (ev) => {
      const a = ev.target.closest('[data-s]'); if (!a) return;
      S.welcomed = true; persist(); closeSheet();
      if (a.dataset.s === 'od') msConnect();
    };
  });
}

/* ---------- Toast ---------- */
let toastTimer;
function toast(msg, undo) {
  const el = $('#toast');
  el.innerHTML = `<span>${esc(msg)}</span>${undo ? '<button type="button">Rückgängig</button>' : ''}`;
  el.hidden = false;
  if (undo) el.querySelector('button').onclick = () => { el.hidden = true; undo(); };
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; }, undo ? 6500 : 3200);
}

/* ---------- Start ---------- */
render();
(async () => {
  const wasRedirect = await handleAuthRedirect().catch(() => false);
  if (!wasRedirect && !S.welcomed && !connected()) {
    if (S.entries.length || S.slots.length) { S.welcomed = true; persist(); } else welcomeSheet();
  }
  await Sync.now();
  autoFill();
})();
document.addEventListener('visibilitychange', () => { if (!document.hidden) { if (ui.tab === 'heute') render(); Sync.now().then(autoFill); } });
window.addEventListener('online', () => Sync.now());
setInterval(() => { if (!document.hidden) Sync.now(); }, 120000);
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) { /* egal */ }
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js').catch(() => { /* z. B. in eingebetteten Vorschauen nicht erlaubt */ });
}
</script>
</body>
</html>
